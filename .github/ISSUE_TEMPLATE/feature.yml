name: Feature request
description: Propose a change or addition
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / installer
        - MCP tools / protocol
        - Bridge (C++)
        - Docs
        - Research tooling
        - Other
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Help
      options:
        - label: I can send a PR for this.
