name: installer

# Run by ci.yml as its `installer` job, so every push, pull request and the tag
# build (release.yml needs ci) run it; no triggers of its own beyond a manual run.
on:
  workflow_call: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: install on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15   # per image, 1-3 cases; locally ~1 min a case with images cached
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "debian:13", "fedora:44", "archlinux:base-20261011.0.609700"]  # pinned tags; each runs its pipx/nopipx/novenv cases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1
      - name: Install, check, uninstall in a container
        run: CONTAINER_RT=docker installer/test_install.sh "${{ matrix.image }}"

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -x installer/*.sh
