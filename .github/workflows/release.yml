# Tag push vYYYY.MM.N: CI on the tagged sha, then build (read-only) and
# publish (write) a DRAFT GitHub Release. A human clicks Publish.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # CI must pass for this exact sha: run it here as a reusable workflow
  # (no race with the push-to-main run, no API polling).
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-22.04      # oldest supported glibc
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versions agree with the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file_ver="$(cat VERSION)"
          py_ver="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' ck3agent/_version.py)"
          meta_ver="$(sed -n 's/^RELEASE_VERSION = "\(.*\)"$/\1/p' ck3agent/_bridge_meta.py)"
          echo "tag=$tag VERSION=$file_ver _version.py=$py_ver _bridge_meta.py=$meta_ver"
          for v in "$file_ver" "$py_ver" "$meta_ver"; do
            if [ "$v" != "$tag" ]; then echo "::error::version mismatch against tag $tag"; exit 1; fi
          done
          echo "VER=$tag" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      # Written outside the checkout: the bridge's build provenance runs
      # `git status --porcelain`, and an untracked out/ would stamp the shipped
      # library "dirty". The assemble step copies the notes into out/.
      - name: Release notes from CHANGELOG
        run: |
          notes="$RUNNER_TEMP/notes.md"
          awk -v ver="$VER" '/^## /{ on = ($2 == ver) } on && !/^<!--/' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then echo "::error::CHANGELOG.md has no section for $VER"; exit 1; fi
          if head -n1 "$notes" | grep -qi unreleased; then
            echo "::error::CHANGELOG heading for $VER still says unreleased"; exit 1
          fi
          cat >> "$notes" <<EOF

          Debug symbols: rename \`libck3_bridge-${VER}.so.debug\` to \`libck3_bridge.so.debug\` and put it beside \`libck3_bridge.so\`.
          Verify downloads against \`SHA256SUMS\` and \`gh attestation verify\` (docs/getting-started.md).
          EOF

      - name: Build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential git binutils

      - name: Build bridge (strict BuildID, Zydis from source)
        run: |
          cmake -S bridge -B bridge/build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCK3_STRICT_BUILD_ID=ON -DBUILD_BRIDGE_TESTS=ON
          cmake --build bridge/build -- -j"$(nproc)"
          (cd bridge/build && ctest --output-on-failure)

      - name: Build provenance names this commit and a clean tree
        run: |
          h=bridge/build/build_provenance.h; cat "$h"
          grep -q "GIT_SHA *= *\"${GITHUB_SHA:0:12}\"" "$h" || { echo "::error::provenance GIT_SHA is not $GITHUB_SHA"; exit 1; }
          grep -q 'GIT_DIRTY *= *"clean"' "$h" || { echo "::error::provenance says the tree was dirty at build time; git status:"; git status --porcelain; exit 1; }

      - name: Split debug info
        run: |
          cd bridge/build
          objcopy --only-keep-debug libck3_bridge.so libck3_bridge.so.debug
          strip --strip-debug --strip-unneeded libck3_bridge.so
          objcopy --add-gnu-debuglink=libck3_bridge.so.debug libck3_bridge.so
          ls -la libck3_bridge.so libck3_bridge.so.debug

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install build==1.6.1 hatchling==1.32.4
          python -m build --no-isolation
          python -m venv /tmp/v && /tmp/v/bin/pip install -q dist/*.whl && /tmp/v/bin/ck3agent version

      - name: Assemble tarball
        run: |
          mkdir -p out && cp "$RUNNER_TEMP/notes.md" out/notes.md
          set -e
          name="ck3agent-${VER}-linux-x86_64"
          d="stage/$name"
          mkdir -p "$d/lib" "$d/share" "$d/wheels"
          cp bridge/build/libck3_bridge.so "$d/lib/"
          cp ck3agent/data/trigger_subclasses.csv "$d/share/"
          cp dist/*.whl "$d/wheels/"
          # runtime dependencies for every supported Python, so the tarball installs offline
          # (the same script installer/test_install.sh bundles with)
          installer/bundle_wheels.sh "$d/wheels" dist/*.whl
          (cd "$d/wheels" && sha256sum *.whl > SHA256SUMS)   # the exact third-party closure this release bundles
          cp installer/install.sh installer/uninstall.sh "$d/"
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md VERSION UPSTREAM CITATION.cff "$d/"
          cp installer/README.txt "$d/README.txt"
          chmod +x "$d"/*.sh
          # reproducible: fixed order, owner and mtime (tagged commit time), no gzip timestamp
          tar -C stage --owner=0 --group=0 --numeric-owner --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" -cf - "$name" | gzip -n -9 > "out/$name.tar.gz"
          cp bridge/build/libck3_bridge.so.debug "out/libck3_bridge-${VER}.so.debug"
          cp dist/*.whl dist/*.tar.gz out/
          (cd out && sha256sum -- *.tar.gz *.whl *.debug > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-out
          path: out/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-out
          path: out

      # GitHub stores attestations only for public repos (or paid plans).
      # Skipped on the private pre-release repo; fatal everywhere else.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.tar.gz
            out/*.whl
            out/*.debug

      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          files=(out/*.tar.gz out/*.whl out/*.debug out/SHA256SUMS)
          # `gh release view` does not return drafts, so look in the list
          state="$(gh release list --limit 200 --json tagName,isDraft --jq ".[] | select(.tagName==\"$tag\") | .isDraft")"
          if [ "$state" = false ]; then
            echo "::error::$tag is already published; refusing to touch it"; exit 1
          elif [ "$state" = true ]; then
            gh release upload "$tag" --clobber "${files[@]}"
            gh release edit "$tag" --title "ck3agent $ver" --notes-file out/notes.md
          else
            gh release create "$tag" --draft --verify-tag --title "ck3agent $ver" --notes-file out/notes.md "${files[@]}"
          fi
